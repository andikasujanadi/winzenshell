<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinZen Control Center</title>
  <link rel="stylesheet" href="universal-theme.css" />
  <link rel="stylesheet" href="control-center.css" />
</head>
<body>
  <div class="cc-container" id="ccContainer">
    <!-- Grid Layout for 4-Column Modular Widgets -->
    <main class="cc-grid" id="ccGrid">
      <!-- Widgets mounted here dynamically (1x1, 2x1, 2x2, 3x1, 4x1) -->
    </main>

    <!-- Bottom Pill Action Bar -->
    <footer class="cc-bottom-bar" id="ccBottomBar">
      <button class="cc-pill-btn" id="btnEditControls" type="button">Edit Controls</button>
      <button class="cc-pill-btn cc-add-btn" id="btnAddWidget" type="button" style="display: none;">+ Add Widget</button>
      <button class="cc-pill-btn cc-done-btn" id="btnDoneControls" type="button" style="display: none;">Done</button>
    </footer>

    <!-- Add Widget Drawer (shows available widgets not yet in Control Center) -->
    <div class="cc-add-drawer" id="ccAddDrawer" style="display: none;">
      <div class="cc-drawer-header">
        <span class="cc-drawer-title">Add Widget</span>
        <button class="cc-drawer-close" id="btnCcCloseDrawer" type="button" aria-label="Close">✕</button>
      </div>
      <div class="cc-drawer-list" id="ccDrawerList"></div>
    </div>
  </div>

  <script src="bridge.js"></script>
  <script src="control-center.js"></script>
</body>
</html>
