<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinZenShell Taskbar</title>
  <link rel="stylesheet" href="universal-theme.css?v=3" />
  <link rel="stylesheet" href="taskbar.css?v=8" />
</head>
<body>
  <div class="taskbar-bar" id="taskbarBar">
    <div class="taskbar-wallpaper-layer" id="taskbarWallpaperLayer" aria-hidden="true"></div>
    <div class="taskbar-surface-layer" id="taskbarSurfaceLayer" aria-hidden="true"></div>
    <!-- Left Widget Zone -->
    <div class="taskbar-zone zone-left" id="slot-left"></div>

    <!-- Center Widget Zone -->
    <div class="taskbar-zone zone-center" id="slot-center"></div>

    <!-- Right Widget Zone + Quick Studio Trigger -->
    <div class="right-wrapper">
      <div class="taskbar-zone zone-right" id="slot-right"></div>
      <button id="btnOpenStudio" class="studio-btn" aria-label="Settings">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <circle cx="8" cy="3" r="1.3"/>
          <circle cx="8" cy="8" r="1.3"/>
          <circle cx="8" cy="13" r="1.3"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="bridge.js?v=5"></script>
  <script src="taskbar.js?v=8"></script>
</body>
</html>
