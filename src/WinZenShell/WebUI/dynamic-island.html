<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Island</title>
  <link rel="stylesheet" href="dynamic-island.css" />
</head>
<body>
  <div class="island-container" id="islandContainer">
    <div class="dynamic-island-capsule pitch-black" id="islandCapsule" role="button" tabindex="0">
      <!-- 1. Collapsed Island Pill -->
      <div class="island-collapsed-content" id="islandCollapsedContent">
        <span class="di-time" id="diTime">--:--</span>
        <span class="di-seconds" id="diSeconds" style="display:none;">:00</span>
        <span class="di-sep" id="diSep" style="display:none;"></span>
        <span class="di-date" id="diDate" style="display:none;"></span>
      </div>

      <!-- 2. Expanded Island Card: Clock & Date -->
      <div class="island-expanded-content" id="islandExpandedContent">
        <div class="di-card-header">
          <div class="di-card-header-left">
            <span class="di-card-badge" id="diCardWeekday">SUNDAY</span>
            <span class="di-card-dot">•</span>
            <span class="di-card-date-short" id="diCardDateShort">NOV 15, 2026</span>
          </div>
        </div>

        <div class="di-card-clock-area">
          <div class="di-card-clock">
            <span class="di-card-time" id="diCardTime">--:--</span>
            <span class="di-card-seconds" id="diCardSeconds">:00</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="bridge.js"></script>
  <script src="dynamic-island.js"></script>
</body>
</html>
