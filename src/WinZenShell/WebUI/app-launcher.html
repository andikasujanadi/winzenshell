<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinZen App Launcher</title>
  <link rel="stylesheet" href="universal-theme.css" />
  <link rel="stylesheet" href="app-launcher.css" />
</head>
<body>
  <div class="launcher-shell" id="launcherShell">
    <!-- ChromeOS Search Bar -->
    <div class="search-box-wrap">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search your apps..." autocomplete="off" spellcheck="false" autofocus />
        <button id="btnClearSearch" class="btn-clear-search" title="Clear search (Esc)" style="display:none;">✕</button>
      </div>
    </div>

    <!-- Scrollable Content Area -->
    <div class="launcher-content" id="launcherContent">
      <!-- Pinned Apps Row (visible when pinned apps exist and search is empty) -->
      <section class="section-pinned" id="sectionPinned" style="display:none;">
        <div class="section-header-row">
          <div class="section-title">Pinned</div>
          <span class="section-subtitle-hint">Drag to reorder</span>
        </div>
        <div class="pinned-row" id="pinnedGrid">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Recent Apps Row (visible when search is empty) -->
      <section class="section-recent" id="sectionRecent">
        <div class="section-title">Recent</div>
        <div class="recent-row" id="recentGrid">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Apps Grid -->
      <section class="section-all" id="sectionAll">
        <div class="section-header-row">
          <div class="section-title" id="allAppsTitle">All Apps</div>
          <span class="app-count-badge" id="appCountBadge">0</span>
        </div>
        <div class="apps-grid" id="appsGrid">
          <!-- Populated by JS -->
        </div>
      </section>
    </div>

    <!-- Folder Modal Overlay -->
    <div class="folder-overlay" id="folderOverlay" style="display:none;">
      <div class="folder-backdrop" id="folderBackdrop"></div>
      <div class="folder-dialog" id="folderDialog">
        <div class="folder-header">
          <input type="text" class="folder-title-input" id="folderTitleInput" value="Folder" placeholder="Folder Name" spellcheck="false" />
          <div class="folder-actions">
            <button type="button" class="folder-ungroup-btn" id="btnUngroupFolder" title="Ungroup folder into individual apps">Ungroup</button>
            <button type="button" class="folder-close-btn" id="btnFolderClose" title="Close folder (Esc)">✕</button>
          </div>
        </div>
        <div class="folder-grid" id="folderGrid">
          <!-- Folder app items populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="app-launcher.js"></script>
</body>
</html>
