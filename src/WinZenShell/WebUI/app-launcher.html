<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinZen App Launcher</title>
  <link rel="stylesheet" href="universal-theme.css" />
  <link rel="stylesheet" href="app-launcher.css" />
</head>
<body>
  <div class="launcher-shell" id="launcherShell">
    <!-- ChromeOS Search Bar -->
    <div class="search-box-wrap">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search your apps..." autocomplete="off" spellcheck="false" autofocus />
        <button id="btnClearSearch" class="btn-clear-search" title="Clear search (Esc)" style="display:none;">✕</button>
      </div>
    </div>

    <!-- Scrollable Content Area -->
    <div class="launcher-content" id="launcherContent">
      <!-- Recent Apps Row (visible when search is empty) -->
      <section class="section-recent" id="sectionRecent">
        <div class="section-title">Recent</div>
        <div class="recent-row" id="recentGrid">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Apps Grid -->
      <section class="section-all" id="sectionAll">
        <div class="section-header-row">
          <div class="section-title" id="allAppsTitle">All Apps</div>
          <span class="app-count-badge" id="appCountBadge">0</span>
        </div>
        <div class="apps-grid" id="appsGrid">
          <!-- Populated by JS -->
        </div>
      </section>
    </div>

    <!-- Footer Quick Actions -->
    <div class="launcher-footer">
      <div class="footer-left">
        <span class="footer-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate &bull; <kbd>Enter</kbd> open &bull; <kbd>Esc</kbd> dismiss</span>
      </div>
      <div class="footer-right">
        <button id="btnFooterSettings" class="footer-icon-btn" title="WinZenShell Settings">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app-launcher.js"></script>
</body>
</html>
