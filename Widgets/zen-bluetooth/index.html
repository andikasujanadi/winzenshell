<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bluetooth-pill state-off" id="btnBluetooth" aria-label="Bluetooth">
    <div class="bluetooth-icon-wrap" id="iconWrap" title="Toggle Bluetooth">
      <svg class="bt-icon" id="btSvg" viewBox="0 0 24 24">
        <path id="btPath" d="m7 7 10 10-5 5V2l5 5L7 17" />
      </svg>
    </div>
    <div class="bt-text-col" id="textCol" title="Bluetooth Devices &amp; Flyout">
      <span class="bt-label" id="btLabel">Bluetooth</span>
      <span class="bt-sublabel" id="btSubLabel">Off</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
