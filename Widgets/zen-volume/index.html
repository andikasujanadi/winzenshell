<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Icon Mode View -->
  <div class="view-icon" id="viewIcon">
    <button class="volume-btn" id="btnVolume" title="Master Volume" aria-label="Master Volume">
      <svg class="volume-icon" id="iconSpeaker" viewBox="0 0 16 16" fill="currentColor">
        <path id="speakerPath" d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.476 7.476 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303l.708.707zM10.121 12.6A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.482 5.482 0 0 1 11.025 8a5.483 5.483 0 0 1-1.61 3.89l.706.71zM8.707 11.185A4.486 4.486 0 0 0 10.025 8a4.486 4.486 0 0 0-1.318-3.185l-.707.707A3.49 3.49 0 0 1 9.025 8a3.49 3.49 0 0 1-1.025 2.478l.707.707zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z"/>
      </svg>
    </button>
  </div>

  <!-- Widget Mode View (1:2 Slider Widget / 1:1 CC Card) -->
  <div class="view-widget" id="viewWidget">
    <div class="slider-row">
      <button class="slider-mute-btn" id="btnSliderMute" title="Toggle Mute" aria-label="Toggle Mute">
        <svg class="slider-icon" id="sliderSpeakerIcon" viewBox="0 0 16 16" fill="currentColor">
          <path id="sliderSpeakerPath" d="M11.536 14.01A8.473 8.473 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.476 7.476 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303l.708.707zM10.121 12.6A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.482 5.482 0 0 1 11.025 8a5.483 5.483 0 0 1-1.61 3.89l.706.71zM8.707 11.185A4.486 4.486 0 0 0 10.025 8a4.486 4.486 0 0 0-1.318-3.185l-.707.707A3.49 3.49 0 0 1 9.025 8a3.49 3.49 0 0 1-1.025 2.478l.707.707zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z"/>
        </svg>
      </button>
      <input type="range" min="0" max="100" value="50" class="volume-slider" id="volumeInput" aria-label="Volume Slider" />
      <span class="slider-val" id="sliderVal">50%</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
