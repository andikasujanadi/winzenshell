<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button class="cc-btn" id="btnControlCenter" aria-label="Control Center">
    <svg class="cc-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Top toggle switch: knob on the right -->
      <rect x="1.5" y="2.5" width="13" height="5" rx="2.5" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="11.5" cy="5" r="1.6" fill="currentColor"/>
      <!-- Bottom toggle switch: knob on the left -->
      <rect x="1.5" y="8.5" width="13" height="5" rx="2.5" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="4.5" cy="11" r="1.6" fill="currentColor"/>
    </svg>
  </button>
  <script src="script.js"></script>
</body>
</html>
