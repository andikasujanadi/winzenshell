<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zen System Tray</title>
  <link rel="stylesheet" href="../universal-theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="trayRoot" class="tray-container">
    <button id="trayChevronBtn" class="tray-btn tray-chevron" type="button" title="Show hidden icons" aria-label="Show hidden icons">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3.5 10L8 5.5L12.5 10" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <div id="trayInlineIcons" class="tray-inline-list"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
