<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Icon Mode View (Compact Chip Button) -->
  <div class="view-icon" id="viewIcon">
    <button class="icon-btn" id="btnSysIcon" title="Performance Telemetry" aria-label="Performance Telemetry">
      <svg class="chip-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M5 0a.5.5 0 0 1 .5.5V2h1V.5a.5.5 0 0 1 1 0V2h1V.5a.5.5 0 0 1 1 0V2h1V.5a.5.5 0 0 1 1 0V2h.5A2.5 2.5 0 0 1 14 4.5v.5h1.5a.5.5 0 0 1 0 1H14v1h1.5a.5.5 0 0 1 0 1H14v1h1.5a.5.5 0 0 1 0 1H14v.5a2.5 2.5 0 0 1-2.5 2.5H11v1.5a.5.5 0 0 1-1 0V14H9v1.5a.5.5 0 0 1-1 0V14H7v1.5a.5.5 0 0 1-1 0V14H5.5A2.5 2.5 0 0 1 3 11.5V11H1.5a.5.5 0 0 1 0-1H3V9H1.5a.5.5 0 0 1 0-1H3V7H1.5a.5.5 0 0 1 0-1H3v-.5A2.5 2.5 0 0 1 5.5 2H6V.5A.5.5 0 0 1 5 0zm-.5 3A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13h7a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 11.5 3h-7zM5 5h6v6H5V5z"/>
      </svg>
    </button>
  </div>

  <!-- Widget Mode View (CPU + RAM + GPU telemetry) -->
  <div class="view-widget" id="viewWidget">
    <div class="sys-pill" id="sysPill" title="Live System Telemetry">
      <div class="stat-col" id="colCpu">
        <div class="stat-head"><span>CPU</span><strong id="cpuVal">--%</strong></div>
        <div class="bar-track"><div class="bar-fill cpu" id="cpuBar" style="width: 0%"></div></div>
      </div>
      <div class="stat-col" id="colRam">
        <div class="stat-head"><span>RAM</span><strong id="ramVal">--%</strong></div>
        <div class="bar-track"><div class="bar-fill ram" id="ramBar" style="width: 0%"></div></div>
      </div>
      <div class="stat-col" id="colGpu">
        <div class="stat-head"><span>GPU</span><strong id="gpuVal">--%</strong></div>
        <div class="bar-track"><div class="bar-fill gpu" id="gpuBar" style="width: 0%"></div></div>
      </div>
      <div class="stat-empty" id="colNone" style="display: none;">Telemetry</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
